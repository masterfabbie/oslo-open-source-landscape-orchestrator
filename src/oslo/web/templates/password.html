{% extends "base.html" %}
{% block title %}{{ t("account.password") }}{% endblock %}
{% block content %}
<p class="crumbs"><a href="/account">{{ t("account.title") }}</a></p>
<h1>{{ t("account.password") }}</h1>
<section class="card narrow">
  <form method="post" action="/account/password" class="stack">
    <label>{{ t("account.current_password") }} <input name="current" type="password" required autocomplete="current-password"></label>
    <label>{{ t("account.new_password") }} <input name="password" type="password" required autocomplete="new-password" minlength="12"></label>
    <label>{{ t("field.password_repeat") }} <input name="password_repeat" type="password" required autocomplete="new-password" minlength="12"></label>
    <p class="muted">{{ t("account.password_hint") }}</p>
    <div><button type="submit">{{ t("action.save") }}</button></div>
  </form>
</section>
{% endblock %}

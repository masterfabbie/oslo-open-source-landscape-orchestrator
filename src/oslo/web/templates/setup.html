{% extends "base.html" %}
{% block title %}{{ t("setup.title") }}{% endblock %}
{% block nav %}{% endblock %}
{% block session %}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t("setup.title") }}</h1>
  <p class="muted">{{ t("setup.hint") }}</p>
  <form method="post" action="/setup" class="stack">
    <label>{{ t("setup.code") }} <input name="code" required autocomplete="off" autofocus></label>
    <label>{{ t("field.username") }} <input name="username" required autocomplete="username" maxlength="64"></label>
    <label>{{ t("field.display_name") }} <input name="display_name" maxlength="255"></label>
    <label>{{ t("field.password") }} <input name="password" type="password" required autocomplete="new-password" minlength="12"></label>
    <label>{{ t("field.password_repeat") }} <input name="password_repeat" type="password" required autocomplete="new-password" minlength="12"></label>
    <div><button type="submit">{{ t("setup.submit") }}</button></div>
  </form>
</section>
{% endblock %}

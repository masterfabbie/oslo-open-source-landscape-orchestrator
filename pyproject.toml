[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oslo"
version = "0.1.0"
description = "Orchestrierung von SAP-Systemlandschaften über SAP Host Agent und sapstartsrv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "cryptography>=42",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
oslo-bundle = "oslo.bundle:main"
oslo-db = "oslo.db:main"
oslo-keygen = "oslo.crypto:keygen"
oslo-mock = "oslo.mock.server:main"
oslo-server = "oslo.server:main"
oslo-user = "oslo.usercli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oslo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
